<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Menu Management — Friends Cafe Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <style>
        /* ===== ULTRA-PREMIUM ADMIN THEME ===== */
        :root {
            --sidebar-width: 280px;
            --bg-body: #050302;         
            --bg-card: #0A0705;         
            --bg-table-header: rgba(255, 255, 255, 0.02);
            --bg-row-hover: rgba(229, 193, 88, 0.04);
            --text-primary: #FFFFFF;
            --text-muted: #A39185;
            --text-gold: #E5C158;
            --border-faint: rgba(255, 255, 255, 0.06);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(229, 193, 88, 0.03) 0%, transparent 70%);
        }

        .main {
            margin-left: var(--sidebar-width);
            padding: 40px 30px;
            width: calc(100% - var(--sidebar-width));
            display: flex; flex-direction: column;
        }

        /* ===== HEADER ===== */
        .header { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--border-faint); display: flex; justify-content: space-between; align-items: flex-end; }
        .header h1 { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 500; color: var(--text-primary); }
        .header h1 em { color: var(--text-gold); font-style: italic; }
        
        .btn-add {
            background: var(--text-gold); color: #000; padding: 12px 24px; border-radius: 8px;
            text-decoration: none; font-weight: 700; font-size: 13px; text-transform: uppercase;
            letter-spacing: 1px; transition: var(--transition); display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 10px 20px rgba(229, 193, 88, 0.15);
        }
        .btn-add:hover { background: #F4D37A; transform: translateY(-2px); box-shadow: 0 15px 30px rgba(229, 193, 88, 0.3); }

        /* ===== CATEGORY SECTIONS ===== */
        .category-section { margin-bottom: 50px; animation: fadeUp 0.6s ease forwards; opacity: 0; }
        .category-section:nth-child(2) { animation-delay: 0.1s; }
        .category-section:nth-child(3) { animation-delay: 0.2s; }
        .category-section:nth-child(4) { animation-delay: 0.3s; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .category-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .category-header h2 { font-family: 'Playfair Display', serif; font-size: 26px; color: white; font-weight: 400; }
        .category-line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border-faint), transparent); }

        /* ===== TABLES ===== */
        .card { 
            background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-faint); 
            overflow: hidden; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg-table-header); color: var(--text-muted); padding: 16px 20px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;}
        td { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 13px; color: var(--text-primary); vertical-align: middle; }
        tr:hover td { background: var(--bg-row-hover); }
        tr:last-child td { border-bottom: none; }

        /* Typography & Tags */
        .item-name { font-weight: 600; font-size: 15px; color: white; margin-bottom: 4px; display: block;}
        .price-tag { color: var(--text-gold); font-weight: 600; font-size: 15px; }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; border: 1px solid var(--border-faint); background: rgba(255,255,255,0.03); color: var(--text-muted); }
        .badge-featured { background: rgba(72, 187, 120, 0.15); color: #48BB78; border-color: rgba(72, 187, 120, 0.3); }

        .item-img { border-radius: 8px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1); width: 60px; height: 60px; background: var(--bg-body); }

        /* ===== ACTION BUTTONS ===== */
        .action-cell { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-edit, .btn-delete { padding: 6px 14px; border-radius: 6px; text-decoration: none; font-size: 11px; font-weight: 600; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; letter-spacing: 0.5px; text-transform: uppercase; }
        .btn-edit { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border-faint); }
        .btn-edit:hover { background: var(--text-gold); color: #000; border-color: var(--text-gold); }
        .btn-delete { background: transparent; color: #E53E3E; border: 1px solid rgba(229, 62, 62, 0.3); }
        .btn-delete:hover { background: rgba(229, 62, 62, 0.1); border-color: #E53E3E; }

        @media (max-width: 1024px) { .main { margin-left: 220px; width: calc(100% - 220px); padding: 30px 20px;} }
    </style>
</head>
<body>

<div th:replace="fragments/admin-sidebar :: sidebar"></div>

<div class="main">

<div class="header">
        <h2>Menu Management</h2>
        
        <div style="display: flex; gap: 15px; align-items: center;">
            
            <form th:action="@{/admin/menu}" method="get" style="display: flex; gap: 10px; margin: 0;">
                <input type="text" name="keyword" placeholder="Search by name..." 
                       style="padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-light); outline: none; font-family: inherit; font-size: 14px; min-width: 200px;">
                <button type="submit" class="btn-add" style="cursor: pointer;">Search</button>
            </form>

            <a th:href="@{/admin/menu/add}" class="btn-add">
                <span>+</span> Add New Item
            </a>
        </div>
    </div>

    <div class="category-section">
        <div class="category-header">
            <h2>☕ Signature Coffees</h2>
            <div class="category-line"></div>
        </div>
        <div class="card">
            <table>
                <thead>
                  <tr>
                    <th>Image</th> <th>Item Details</th> <th>Price</th> <th>Featured</th> <th style="text-align: right;">Action</th>
                  </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${menuList}" th:if="${#strings.equalsIgnoreCase(item.category, 'Coffee')}">
                        <td style="width: 80px;">
                            <img th:src="@{'/images/' + ${item.image_url}}" class="item-img" alt="Coffee">
                        </td>
                        <td>
                            <span class="item-name" th:text="${item.name}"></span>
                            <span class="badge" th:if="${item.tag != null and item.tag != ''}" th:text="${item.tag}"></span>
                        </td>
                        <td class="price-tag" th:text="'₹' + ${item.price}"></td>
                        <td>
                            <span th:text="${item.featured}" th:class="${#strings.equalsIgnoreCase(item.featured, 'Yes')} ? 'badge badge-featured' : 'badge'"></span>
                        </td>
                        <td class="action-cell">
                            <a th:href="@{/admin/menu/edit/{id}(id=${item.menu_id})}" class="btn-edit">Edit</a>
                            <a th:href="@{/admin/menu/delete/{id}(id=${item.menu_id})}" onclick="return confirm('Delete this coffee?')" class="btn-delete">Del</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="category-section">
        <div class="category-header">
            <h2>🍹 Refreshing Beverages</h2>
            <div class="category-line"></div>
        </div>
        <div class="card">
            <table>
                <thead>
                  <tr>
                    <th>Image</th> <th>Item Details</th> <th>Price</th> <th>Featured</th> <th style="text-align: right;">Action</th>
                  </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${menuList}" th:if="${#strings.equalsIgnoreCase(item.category, 'Beverages')}">
                        <td style="width: 80px;">
                            <img th:src="@{'/images/' + ${item.image_url}}" class="item-img" alt="Beverage">
                        </td>
                        <td>
                            <span class="item-name" th:text="${item.name}"></span>
                            <span class="badge" th:if="${item.tag != null and item.tag != ''}" th:text="${item.tag}"></span>
                        </td>
                        <td class="price-tag" th:text="'₹' + ${item.price}"></td>
                        <td>
                            <span th:text="${item.featured}" th:class="${#strings.equalsIgnoreCase(item.featured, 'Yes')} ? 'badge badge-featured' : 'badge'"></span>
                        </td>
                        <td class="action-cell">
                            <a th:href="@{/admin/menu/edit/{id}(id=${item.menu_id})}" class="btn-edit">Edit</a>
                            <a th:href="@{/admin/menu/delete/{id}(id=${item.menu_id})}" onclick="return confirm('Delete this beverage?')" class="btn-delete">Del</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="category-section">
        <div class="category-header">
            <h2>🍰 Decadent Desserts</h2>
            <div class="category-line"></div>
        </div>
        <div class="card">
            <table>
                <thead>
                  <tr>
                    <th>Image</th> <th>Item Details</th> <th>Price</th> <th>Featured</th> <th style="text-align: right;">Action</th>
                  </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${menuList}" th:if="${#strings.equalsIgnoreCase(item.category, 'Desserts')}">
                        <td style="width: 80px;">
                            <img th:src="@{'/images/' + ${item.image_url}}" class="item-img" alt="Dessert">
                        </td>
                        <td>
                            <span class="item-name" th:text="${item.name}"></span>
                            <span class="badge" th:if="${item.tag != null and item.tag != ''}" th:text="${item.tag}"></span>
                        </td>
                        <td class="price-tag" th:text="'₹' + ${item.price}"></td>
                        <td>
                            <span th:text="${item.featured}" th:class="${#strings.equalsIgnoreCase(item.featured, 'Yes')} ? 'badge badge-featured' : 'badge'"></span>
                        </td>
                        <td class="action-cell">
                            <a th:href="@{/admin/menu/edit/{id}(id=${item.menu_id})}" class="btn-edit">Edit</a>
                            <a th:href="@{/admin/menu/delete/{id}(id=${item.menu_id})}" onclick="return confirm('Delete this dessert?')" class="btn-delete">Del</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Edit Reservation — Friends Cafe Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   ULTRA-PREMIUM ADMIN THEME - FRIENDS CAFE
   Theme: Obsidian Espresso & Liquid Gold
   ========================================================================== */
   
:root {
    /* Deep Obsidian/Espresso Backgrounds */
    --bg-body: #050302;         
    --bg-card: #0A0705;         
    
    /* Typography */
    --text-primary: #FFFFFF;
    --text-muted: #A39185;
    --text-gold: #E5C158;
    
    /* Borders & Accents */
    --border-faint: rgba(255, 255, 255, 0.06);
    --border-glow: rgba(229, 193, 88, 0.2);
    --radius: 16px;
    --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-body);
    color: var(--text-primary);
    display: flex;
    min-height: 100vh;
    line-height: 1.6;
    
    /* Subtle texture overlay */
    background-image: radial-gradient(circle at 50% 0%, rgba(229, 193, 88, 0.03) 0%, transparent 70%),
                      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
}

/* ===== LAYOUT & CARD (Glassmorphism) ===== */
.edit-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 60px 20px;
    width: 100%;
}

.edit-card {
    background: var(--bg-card);
    padding: 50px 60px;
    width: 100%;
    max-width: 650px;
    border-radius: var(--radius);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-faint);
    position: relative;
    animation: fadeUp 0.6s ease forwards;
}

.edit-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--border-glow), transparent);
    border-radius: var(--radius) var(--radius) 0 0;
}

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ===== TYPOGRAPHY ===== */
.edit-card h2 {
    font-family: 'Playfair Display', serif;
    font-size: 42px;
    font-weight: 300;
    color: var(--text-primary);
    margin-bottom: 40px;
    text-align: center;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border-faint);
    padding-bottom: 25px;
}

.edit-card h2 em { font-style: italic; color: var(--text-gold); }

/* ===== FORM FIELDS ===== */
.form-row { display: flex; gap: 25px; }

.form-group {
    margin-bottom: 25px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.form-group label {
    margin-bottom: 10px;
    font-weight: 600;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--text-muted);
}

.form-group input,
.form-group select {
    font-family: 'Inter', sans-serif;
    padding: 16px 20px;
    border-radius: 8px;
    border: 1px solid var(--border-faint);
    background: rgba(255, 255, 255, 0.02);
    font-size: 15px;
    color: var(--text-primary);
    transition: var(--transition);
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--text-gold);
    outline: none;
    box-shadow: 0 0 15px rgba(229, 193, 88, 0.1);
    background: rgba(0,0,0,0.5);
}

/* Custom Select Dropdown Styling for Dark Mode */
.form-group select {
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23E5C158%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 16px top 50%;
    background-size: 10px auto;
}

.form-group select option { background: var(--bg-card); color: var(--text-primary); }

/* Color overrides for Date/Time picker icons in Chrome/Edge */
::-webkit-calendar-picker-indicator { filter: invert(1) opacity(0.5); cursor: pointer; transition: 0.3s; }
::-webkit-calendar-picker-indicator:hover { filter: invert(0.8) sepia(1) saturate(5) hue-rotate(350deg); opacity: 1; }

/* ===== BUTTONS ===== */
.btn-row {
    display: flex;
    gap: 20px;
    margin-top: 45px;
    border-top: 1px solid var(--border-faint);
    padding-top: 30px;
}

.btn-save, .btn-cancel {
    flex: 1;
    text-align: center;
    padding: 16px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: var(--transition);
    cursor: pointer;
    text-decoration: none;
    border: none;
}

.btn-save {
    background: var(--text-gold);
    color: #000;
    box-shadow: 0 10px 20px rgba(229, 193, 88, 0.2);
}

.btn-save:hover {
    background: #F4D37A;
    transform: translateY(-2px);
    box-shadow: 0 15px 30px rgba(229, 193, 88, 0.3);
}

.btn-cancel {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid transparent;
}

.btn-cancel:hover {
    color: #E53E3E;
    background: rgba(229, 62, 62, 0.05);
    border: 1px solid rgba(229, 62, 62, 0.2);
}

@media (max-width: 768px) {
    .form-row { flex-direction: column; gap: 0; }
    .edit-card { padding: 40px 30px; }
}
</style>
</head>

<body>

<div th:replace="fragments/admin-sidebar :: sidebar"></div>

<div class="edit-container">
    <div class="edit-card">
        <h2>Edit <em>Reservation</em></h2>

        <form th:action="@{/admin/update}" 
              th:object="${reservation}" 
              method="post">

            <input type="hidden" th:field="*{reservation_id}">

            <div class="form-row">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" th:field="*{customer_name}" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" th:field="*{phone}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" th:field="*{reservation_date}" required>
                </div>

                <div class="form-group">
                    <label>Time</label>
                    <input type="time" th:field="*{reservation_time}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Guests</label>
                    <input type="number" th:field="*{guests}" min="1" max="20" required>
                </div>

                <div class="form-group">
                    <label>Mood</label>
                    <input type="text" th:field="*{mood}">
                </div>
            </div>

            <div class="form-group">
                <label>Occasion</label>
                <input type="text" th:field="*{occasion}">
            </div>

            <div class="form-group">
                <label>Special Request</label>
                <textarea th:field="*{special_request}" rows="3" style="font-family: 'Inter', sans-serif; padding: 16px 20px; border-radius: 8px; border: 1px solid var(--border-faint); background: rgba(255, 255, 255, 0.02); font-size: 15px; color: var(--text-primary); transition: var(--transition); resize: vertical;"></textarea>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select th:field="*{status}">
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn-save">Update Reservation</button>
                <a th:href="@{/admin/reservations}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

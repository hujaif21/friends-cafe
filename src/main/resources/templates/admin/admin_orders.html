<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Orders — Friends Cafe Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <style>
        /* ===== RESET & VARIABLES ===== */
        :root {
            --bg-color: #F8F6F2;
            --surface-color: #FFFFFF;
            --text-main: #2C2420;
            --text-muted: #7A706A;
            --sidebar-bg: #1A120B; /* Deep Espresso */
            --accent-gold: #D4AF37;
            --border-light: #EBE6DF;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            margin-left: 260px; /* Offset for sidebar */
            padding: 50px 40px;
            width: calc(100% - 260px);
        }

        /* ===== HEADER ===== */
        .header {
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--sidebar-bg);
        }

        /* ===== TABLE CARD ===== */
        .card {
            background: var(--surface-color);
            border-radius: var(--radius);
            padding: 30px;
            box-shadow: 0 10px 40px rgba(44, 36, 32, 0.05);
            border: 1px solid var(--border-light);
            overflow-x: auto;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th {
            background: #FAF8F5;
            color: var(--text-muted);
            padding: 16px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            border-bottom: 2px solid var(--border-light);
        }

        td {
            padding: 18px 16px;
            border-bottom: 1px solid var(--border-light);
            font-size: 14px;
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:hover td {
            background: #FCFAF8;
        }

        /* ===== BUTTONS ===== */
        .action-cell {
            display: flex;
            gap: 10px;
        }

        .btn-edit, .btn-delete {
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-edit {
            background: #F3EFEA;
            color: var(--sidebar-bg);
            border: 1px solid var(--border-light);
        }

        .btn-edit:hover {
            background: var(--accent-gold);
            color: white;
            border-color: var(--accent-gold);
        }

        .btn-delete {
            background: transparent;
            color: #DC3545;
            border: 1px solid #F5C6CB;
        }

        .btn-delete:hover {
            background: #DC3545;
            color: white;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .main { margin-left: 220px; width: calc(100% - 220px); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .main { margin-left: 0; width: 100%; padding: 20px; }
        }
    </style>
</head>
<body>

<div th:replace="fragments/admin-sidebar :: sidebar"></div>

<div class="main">

    <div class="header">
        <h1>All Orders</h1>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Coffee Selection</th>
                    <th>Total Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="o, iterStat : ${orders}">
                    
                    <td th:text="${iterStat.index + 1}" style="color: var(--text-muted);"></td>
                    
                    <td th:text="${o.customerName}" style="font-weight: 600;"></td>
                    
                    <td th:text="${o.coffeeType}"></td>
                    
                    <td th:text="'₹' + ${o.totalAmount}" style="color: var(--accent-gold); font-weight: 600;"></td>

                    <td class="action-cell">
                        <a th:href="@{'/admin/orders/edit/' + ${o.order_id}}" class="btn-edit">
                            Edit
                        </a>

                        <a th:href="@{'/admin/orders/delete/' + ${o.order_id}}"
                           onclick="return confirm('Are you sure you want to delete this order?')" 
                           class="btn-delete">
                            Delete
                        </a>
                    </td>
                    
                </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>

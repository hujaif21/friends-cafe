<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Order — Friends Cafe Admin</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           ULTRA-PREMIUM ADMIN MAIN CONTENT - FRIENDS CAFE
           Theme: Obsidian Espresso & Liquid Gold
           ========================================================================== */
           
        :root {
            /* Sidebar variables (for layout reference) */
            --sidebar-width: 280px;

            /* Deep Obsidian/Espresso Backgrounds */
            --bg-body: #050302;         /* Purest dark base */
            --bg-card: #0A0705;         /* Slightly lighter for the card */
            --bg-input: rgba(255, 255, 255, 0.02); /* Ghost input background */
            
            /* Typography */
            --text-primary: #FFFFFF;
            --text-muted: #A39185;
            --text-gold: #E5C158;
            
            /* Borders & Accents */
            --border-faint: rgba(255, 255, 255, 0.06);
            --border-input: rgba(255, 255, 255, 0.1);
            --glow-gold: rgba(229, 193, 88, 0.4);
            --glow-shadow: 0 8px 25px rgba(229, 193, 88, 0.1);
            
            --radius: 16px; /* Softer, more modern corners */
            --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            
            /* Subtle texture overlay for the entire background */
            background-image: radial-gradient(circle at 50% 0%, rgba(229, 193, 88, 0.03) 0%, transparent 70%),
                              url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
        }

        /* ===== MAIN CONTENT LAYOUT ===== */
        .main {
            margin-left: var(--sidebar-width);
            padding: 60px 40px;
            width: calc(100% - var(--sidebar-width));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Page Header */
        .page-header {
            width: 100%;
            max-width: 700px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-faint);
            padding-bottom: 20px;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        
        .page-header h1 em {
            color: var(--text-gold);
            font-style: italic;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
            font-weight: 500;
        }

        /* ===== THE MASTERPIECE FORM CARD ===== */
        .form-card {
            background: var(--bg-card);
            padding: 50px 60px;
            width: 100%;
            max-width: 700px;
            border-radius: var(--radius);
            
            /* Glassmorphism / Obsidian Edge Effect */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-faint);
            position: relative;
            overflow: hidden;
        }

        /* Subtle glowing top edge of the card */
        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--glow-gold), transparent);
            opacity: 0.5;
        }

        /* ===== FORM FIELDS ===== */
        .form-row {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
        }

        .form-group label {
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .form-group input[type="text"] {
            font-family: 'Inter', sans-serif;
            padding: 16px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-input);
            background: var(--bg-input);
            font-size: 15px;
            color: var(--text-primary);
            transition: var(--transition);
            width: 100%;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        /* Input Hover & Focus Effects */
        .form-group input:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
        }

        .form-group input:focus {
            border-color: var(--text-gold);
            outline: none;
            background: rgba(10, 7, 5, 0.8);
            box-shadow: 0 0 0 3px rgba(229, 193, 88, 0.15), inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .form-group input:focus + label,
        .form-group input:focus ~ label {
            color: var(--text-gold);
        }

        /* ===== BUTTONS ===== */
        .btn-row {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border-faint);
        }

        .btn-save, .btn-cancel {
            flex: 1;
            text-align: center;
            padding: 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: var(--transition);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid transparent;
        }

        .btn-save {
            background: var(--text-gold);
            color: #000000;
            box-shadow: 0 4px 15px rgba(229, 193, 88, 0.2);
        }

        .btn-save:hover {
            background: #F4D37A; /* Lighter gold on hover */
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(229, 193, 88, 0.4);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border-faint);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .main { margin-left: 220px; width: calc(100% - 220px); padding: 40px 30px; }
            .form-card { padding: 40px; }
        }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; gap: 20px; margin-bottom: 20px; }
            .main { margin-left: 0; width: 100%; padding: 30px 20px; }
            .page-header h1 { font-size: 28px; }
            .form-card { padding: 30px 20px; }
            .btn-row { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

<div th:replace="fragments/admin-sidebar :: sidebar"></div>

<div class="main">
    
    <div class="page-header">
        <h1>Order <em>#<span th:text="${order.order_id}">101</span></em></h1>
        <p>Modify Order Details</p>
    </div>

    <div class="form-card">
        
        <form th:action="@{/admin/orders/update}" method="post" th:object="${order}">

            <input type="hidden" th:field="*{order_id}" />

            <div class="form-row">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" th:field="*{customerName}" placeholder="Enter full name" required />
                </div>
                
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" th:field="*{customerPhone}" placeholder="+91 00000 00000" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Coffee Selection</label>
                    <input type="text" th:field="*{coffeeType}" placeholder="e.g., Iced Caramel Macchiato" required />
                </div>
                
                <div class="form-group">
                    <label>Total Amount (₹)</label>
                    <input type="text" th:field="*{totalAmount}" placeholder="0.00" required />
                </div>
            </div>

            <div class="btn-row">
                <a th:href="@{/admin/orders}" class="btn-cancel">Cancel</a>
                <button type="submit" class="btn-save">Save Changes</button>
            </div>

        </form>
    </div>

</div>

</body>
</html>

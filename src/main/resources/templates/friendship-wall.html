<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Friendship Wall — Friends Cafe Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&family=Caveat:wght@400;600&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <style>
        /* NEW DARK MOODY COLOR PALETTE based on fd.avif */
        :root { 
            --bg-base: #12100E;     /* Very dark espresso/charcoal base */
            --text-light: #E8E3DF;  /* Soft cream for main text */
            --gold-glow: #DCA963;   /* Warm amber/gold from the lamps */
            --text-muted: #9A8F85;  /* Muted grey-brown for secondary text */
            --card-glass: rgba(30, 26, 24, 0.65); /* Dark smoked glass for cards */
            --card-border: rgba(220, 169, 99, 0.2); /* Faint gold border */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Jost', sans-serif; 
            color: var(--text-light);
            min-height: 100vh;
            padding-bottom: 120px; 
            overflow-x: hidden;

            /* 1. The Dark Base */
            background-color: var(--bg-base);

            /* 2. The Dark Overlay & Image Integration */
            /* Using a dark, moody gradient overlay to make the text pop */
            background-image: 
                linear-gradient(rgba(18, 16, 14, 0.75), rgba(18, 16, 14, 0.85)),
                url('/images/fd.avif'); /* Make sure this matches your file name and location */
            
            background-size: cover;          
            background-position: center;     
            background-attachment: fixed;    
        }

        /* --- HEADER --- */
        .board-header { 
            text-align: center; 
            padding: 80px 20px 60px; 
            position: relative;
        }
        .board-header h1 { 
            font-family: 'Cormorant Garamond', serif; 
            font-size: clamp(40px, 6vw, 64px); 
            font-weight: 300;
            color: var(--text-light);
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5); /* Helps text stand out */
        }
        .board-header h1 em { 
            color: var(--gold-glow); 
            font-style: italic; 
        }
        .board-header p {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        /* Decorative line */
        .board-header::after {
            content: '';
            display: block;
            width: 60px;
            height: 1px;
            background: var(--gold-glow);
            margin: 30px auto 0;
            opacity: 0.4;
        }

        /* --- THE MASONRY WALL --- */
        .wall-container { 
            columns: 4 280px; 
            column-gap: 30px;
            padding: 0 40px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }

        /* --- THE GLASS CARDS (Instead of paper notes) --- */
        .sticky-note {
            break-inside: avoid; 
            margin-bottom: 30px;
            padding: 30px; 
            border-radius: 8px; /* Slightly rounder for glass effect */
            
            /* Smoked Glass Effect */
            background: var(--card-glass);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; 
            animation: float 6s ease-in-out infinite alternate;
        }

        .sticky-note:nth-child(even) { animation-delay: -3s; animation-duration: 7s; }
        .sticky-note:nth-child(3n) { animation-delay: -1.5s; animation-duration: 5.5s; }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        .sticky-note:hover { 
            transform: scale(1.03) translateY(-10px) !important; 
            z-index: 10; 
            /* Golden glow on hover */
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(220, 169, 99, 0.15);
            border-color: rgba(220, 169, 99, 0.5);
        }

        /* The Pin - Darkened for the new theme */
        .sticky-note::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold-glow);
            box-shadow: 0 0 10px var(--gold-glow); /* Glowing pin effect */
            opacity: 0.8;
        }

        /* Text needs to be lighter for dark mode */
        .note-text { 
            font-family: 'Caveat', cursive; 
            font-size: 26px; 
            color: #F5F1EE; /* Very light cream */
            line-height: 1.3; 
            margin-top: 10px;
            margin-bottom: 30px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .sticky-note:nth-child(3n) .note-text {
            font-family: 'Shadows Into Light', cursive;
            font-size: 22px;
        }

        .note-sender { 
            font-family: 'Jost', sans-serif;
            font-size: 11px; 
            font-weight: 500; 
            letter-spacing: 1px;
            text-transform: uppercase; 
            color: var(--gold-glow); /* Names in gold */
            position: absolute; 
            bottom: 20px; 
            right: 25px; 
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .note-sender::before {
            content: '♥';
            font-size: 14px;
        }

        /* --- DARK SMOKED GLASS POST BAR --- */
        .post-bar-wrapper {
            position: fixed; 
            bottom: 30px; 
            left: 0; 
            right: 0; 
            display: flex;
            justify-content: center;
            z-index: 100; 
            pointer-events: none; 
        }

        .post-form { 
            pointer-events: auto; 
            display: flex; 
            gap: 12px; 
            /* Dark frosted glass */
            background: rgba(18, 16, 14, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px; 
            border-radius: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            align-items: center; 
            max-width: 90%;
            width: 800px;
            transition: transform 0.3s ease;
        }

        .post-form:focus-within {
            transform: translateY(-5px);
            border-color: rgba(220, 169, 99, 0.4); /* Glow gold when typing */
        }

        .post-input { 
            padding: 14px 24px; 
            border: none; 
            background: transparent;
            font-family: 'Jost', sans-serif; 
            font-size: 15px;
            color: var(--text-light); 
            outline: none;
        }
        
        .post-input::placeholder { color: var(--text-muted); opacity: 0.8; }
        
        .input-name { width: 160px; border-right: 1px solid rgba(255,255,255,0.1); }
        .input-msg { flex: 1; }

      .btn-post { 
            background: var(--gold-glow); 
            
            /* THE FIX: Hardcode the dark espresso color so it never disappears */
            color: #12100E; 
            
            padding: 14px 32px; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-family: 'Jost', sans-serif;
            font-weight: 600; 
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 12px;
            transition: 0.3s; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-post:hover { 
            background: #EED1A1; /* Lighter gold on hover */
            box-shadow: 0 0 15px rgba(220, 169, 99, 0.4);
        }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 768px) {
            .wall-container { columns: 2 200px; padding: 0 20px; }
            .post-form { flex-direction: column; border-radius: 20px; padding: 20px; }
            .input-name { width: 100%; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .btn-post { width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .wall-container { columns: 1; }
        }
        /* --- NEW STAR RATING CSS --- */
        .star-rating {
            display: flex;
            gap: 4px;
            margin: 0 15px;
            cursor: pointer;
        }
        
        .star-rating .star {
            font-size: 20px;
            color: rgba(255,255,255,0.2); /* Default dark/grey star */
            transition: color 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        /* The glowing gold star */
        .star-rating .star.active {
            color: var(--gold-glow);
            text-shadow: 0 0 10px rgba(220, 169, 99, 0.6);
        }

        /* Displayed Stars on the Note */
        .note-stars {
            font-size: 16px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .star-gold { color: var(--gold-glow); text-shadow: 0 0 8px rgba(220, 169, 99, 0.5); }
        .star-grey { color: rgba(255,255,255,0.15); }
        /* ========== BACK TO HOME BUTTON ========== */
        .btn-wall-back {
            display: inline-flex; 
            align-items: center; 
            color: #8C7B6E; /* var(--muted) */
            text-decoration: none;
            font-size: 12px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-weight: 600;
            transition: all 0.3s ease; 
            padding: 12px 28px; 
            border-radius: 50px;
            border: 1px solid rgba(140, 123, 110, 0.2); /* Subtle border */
            background: transparent;
        }

        .btn-wall-back:hover {
            color: #D4A85A; /* var(--gold) */
            border-color: #D4A85A;
            background: rgba(212, 168, 90, 0.05); /* Slight gold glow */
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 168, 90, 0.1);
        }
    </style>
</head>
<body>

    <div class="board-header">
        <h1>Friendship <em>Wall</em></h1>
        <p>Leave a note. Share a moment. Spread the warmth.</p>
    </div>

    <div class="wall-container" id="wall">
        <div th:each="m : ${messages}" class="sticky-note" th:style="'background-color:' + ${m.noteColor}">
            
            <div class="note-stars">
                <span th:each="i : ${#numbers.sequence(1, 5)}" 
                      th:text="'★'" 
                      th:class="${i <= m.rating ? 'star-gold' : 'star-grey'}"></span>
            </div>

            <div class="note-text" th:text="${m.message}"></div>
            <div class="note-sender" th:text="${m.senderName}"></div>
        </div>
    </div>

    <div class="post-bar-wrapper">
        <form th:action="@{/friendship-wall/post}" th:object="${newNote}" method="post" class="post-form">
            <input type="text" th:field="*{senderName}" placeholder="Your Name" class="post-input input-name" required autocomplete="off">
            <input type="text" th:field="*{message}" placeholder="Write a memory or a kind word..." class="post-input input-msg" required autocomplete="off">
            
            <input type="hidden" th:field="*{noteColor}" id="colorInput">
            
            <input type="hidden" th:field="*{rating}" id="ratingInput" value="5">

            <div class="star-rating" id="starContainer">
                <span class="star active" data-val="1">★</span>
                <span class="star active" data-val="2">★</span>
                <span class="star active" data-val="3">★</span>
                <span class="star active" data-val="4">★</span>
                <span class="star active" data-val="5">★</span>
            </div>
            
            <button type="submit" class="btn-post"> submit
            </button>
        </form>
    </div>
    <div style="text-align: center; margin-top: 50px; margin-bottom: 50px; width: 100%;">
        <a th:href="@{/home}" class="btn-wall-back">
            <span style="margin-right: 8px; font-size: 16px; transition: transform 0.3s;">←</span> 
            Return to Home
        </a>
    </div>

    <script>
        // NEW MOODY COLORS: Drawn directly from the chairs and walls in fd.avif
        const moodyColors = [
            'rgba(30, 26, 24, 0.65)',   /* Base smoked glass */
            'rgba(45, 60, 55, 0.65)',   /* Muted dark teal/olive (from chair) */
            'rgba(65, 35, 25, 0.65)',   /* Deep burnt orange/rust (from chair) */
            'rgba(80, 60, 30, 0.65)'    /* Dark amber (from lamps) */
        ];
        
        // Assign color for the NEXT note being posted
        document.getElementById('colorInput').value = moodyColors[Math.floor(Math.random() * moodyColors.length)];

        // Apply slight rotations
        document.addEventListener("DOMContentLoaded", () => {
            const notes = document.querySelectorAll('.sticky-note');
            notes.forEach(note => {
                const rotation = (Math.random() * 4 - 2).toFixed(1);
                note.style.transform = `rotate(${rotation}deg)`;
                
                // Ensure existing notes use the new glass/moody aesthetic
                if(!note.style.backgroundColor || note.style.backgroundColor === 'null' || note.style.backgroundColor.includes('#')) {
                    note.style.backgroundColor = moodyColors[Math.floor(Math.random() * moodyColors.length)];
                }
            });
        });
     // NEW: Star Rating Interaction Logic
        document.addEventListener("DOMContentLoaded", () => {
            const stars = document.querySelectorAll('#starContainer .star');
            const ratingInput = document.getElementById('ratingInput');

            stars.forEach(star => {
                // When you click a star
                star.addEventListener('click', () => {
                    const val = parseInt(star.getAttribute('data-val'));
                    ratingInput.value = val; // Update the hidden Java input
                    
                    // Update the visual colors
                    stars.forEach((s, index) => {
                        if (index < val) {
                            s.classList.add('active'); // Turn Gold
                        } else {
                            s.classList.remove('active'); // Turn Grey
                        }
                    });
                });
            });
            // ... (keep the rest of your DOMContentLoaded code for the notes here) ...
        });
    </script>
</body>
</html>
